<script>
const A=[
['堀与宫村','Horimiya','ホリミヤ','2021','甜系','Sweet','校园,日常,双向奔赴','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx124080-3i22mRVPBS0T.jpg','看似闪耀的堀京子与沉默低调的宫村，因为偶然走进彼此隐藏的生活。关系在坦率与陪伴中自然升温。','Popular Hori and quiet Miyamura discover the private lives they hide at school. Honesty and companionship draw them closer.','节奏轻快、人物真实，适合想看健康沟通与高甜日常的人。','A warm romance built on healthy communication and believable characters.'],
['辉夜大小姐想让我告白','Kaguya-sama: Love Is War','かぐや様は告らせたい','2019','喜剧','Comedy','校园,智斗,傲娇','https://pics.filmaffinity.com/kaguya_sama_wa_kokurasetai_tensai_tachi_no_renai_zunousen-549238945-large.jpg','学生会长白银与副会长辉夜彼此喜欢，却都认定先告白的人会输。恋爱因此变成心理攻防。','Miyuki and Kaguya like each other, but both believe whoever confesses first loses. Romance becomes a battle of wits.','笑点密、演出大胆，感情推进又比表面的闹剧更细腻。','Rapid-fire comedy, bold direction and a tender emotional journey.'],
['更衣人偶坠入爱河','My Dress-Up Darling','その着せ替え人形は恋をする','2022','甜系','Sweet','校园,Cosplay,反差','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx132405-qP7FQYGmNI3d.jpg','喜欢制作人偶的五条新菜遇见热爱 Cosplay 的喜多川海梦，两人以服装制作为起点走进彼此世界。','Shy doll craftsman Wakana meets outgoing cosplay fan Marin. Making costumes opens the door to each other’s worlds.','兴趣被认真对待的感觉很动人，海梦的直率让甜度一路在线。','A joyful story about having your passion taken seriously.'],
['好想告诉你','Kimi ni Todoke','君に届け','2009','慢热','Slow burn','校园,纯爱,成长','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx6045-JujXjoWtslUM.jpg','被误解的爽子在风早的善意中慢慢走出孤独，也第一次学会表达喜欢。','Misunderstood Sawako steps out of isolation through Kazehaya’s kindness and learns to voice her feelings.','它把一句话说出口前的犹豫、期待和勇气拍得格外温柔。','A gentle portrait of the courage it takes to say what you feel.'],
['月色真美','Tsuki ga Kirei','月がきれい','2017','纯爱','Pure love','校园,初恋,写实','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx98202-H6RtsIMZPALF.png','小太郎与茜在初三相识，讯息里的停顿和见面时的紧张构成极其真实的初恋。','Kotaro and Akane meet in middle school. Hesitant texts and awkward meetings shape a true-to-life first love.','克制、安静，却会让人想起因为一条消息而反复看手机的夜晚。','Quiet and restrained, it captures the thrill of waiting for one important message.'],
['宅男腐女恋爱真难','Wotakoi: Love Is Hard for Otaku','ヲタクに恋は難しい','2018','喜剧','Comedy','职场,宅文化,成人恋爱','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/nx99578-oO5KChtfhzln.png','腐女成海在新公司重遇游戏宅宏嵩，两名老朋友开始交往。','Otaku Narumi reunites with gamer Hirotaka at work. Shared hobbies do not automatically make romance easy.','成年人的松弛关系加上密集宅梗，是很好的下班番。','Relaxed adult relationships and sharp otaku humor.'],
['赤发白雪姬','Snow White with the Red Hair','赤髪の白雪姫','2015','治愈','Healing','奇幻,独立女主,宫廷','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21058-GRqasG1xk3bD.jpg','药剂师白雪离开故乡后遇见王子千，两人在平等尊重中相互靠近。','Herbalist Shirayuki leaves home and meets Prince Zen. Mutual respect gradually becomes love.','女主有事业线，感情建立在欣赏与信任上。','An independent heroine and a romance grounded in trust.'],
['NANA','NANA','NANA－ナナ－','2006','现实','Realistic','都市,音乐,群像','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx877-6BUYEWp8By8j.png','名字相同却性格迥异的两位女孩在东京相遇，友情、音乐、爱情与欲望彼此交织。','Two women named Nana meet in Tokyo. Friendship, music, love and ambition collide.','它谈选择的代价；人物并不完美，因此格外难忘。','It explores the cost of every choice; its flawed people feel unforgettable.'],
['和山田谈场 Lv999 的恋爱','My Love Story with Yamada-kun at Lv999','山田くんとLv999の恋をする','2023','甜系','Sweet','游戏,年上年下,日常','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx154965-vZbBRjtmLp7S.jpg','失恋的茜在网游活动遇到职业玩家山田，公会伙伴把两条生活轨迹慢慢连在一起。','After a breakup, Akane meets aloof pro gamer Yamada. Their guild slowly connects two different lives.','成熟姐姐与寡言天才的反差讨喜，暧昧细节很会。','Charming opposites and finely observed moments of attraction.'],
['心灵链环','Kokoro Connect','ココロコネクト','2012','青春','Youth','校园,超自然,群像','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx11887-ypZTwcRqopiL.jpg','五名朋友突然遭遇人格交换，秘密与伤口被迫暴露。','Five friends begin swapping bodies. Secrets and wounds surface, forcing them to relearn trust.','用超自然设定逼角色直面内心，恋爱线与友情线都带着刺。','Its supernatural hook pushes everyone to face what they truly feel.'],
['乔西的虎与鱼','Josee, the Tiger and the Fish','ジョゼと虎と魚たち','2020','治愈','Healing','电影,成长,梦想','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx113596-LKA0bYJGjLnB.jpg','恒夫成为轮椅女孩乔西的照护者，两人从针锋相对到一起看见更大的世界。','Tsuneo becomes a caregiver for Josee. Their clashes turn into a shared view of a wider world.','爱情不是拯救，而是彼此推着对方走向自己的梦想。','Love is not rescue; they push each other toward their own dreams.'],
['龙与虎','Toradora!','とらドラ！','2008','经典','Classic','校园,喜剧,青春','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx4224-PXVMBLNwy2aF.jpg','龙儿与大河决定互助追求彼此的好友，自己的心意却悄悄改变。','Ryuuji and Taiga team up to pursue each other’s friends—until their own feelings change.','从热闹喜剧走向真诚成长，是恋爱番入门经典。','A comedy classic that grows from chaos into sincere coming-of-age drama.'],
['四月是你的谎言','Your Lie in April','四月は君の嘘','2014','催泪','Tearjerker','音乐,青春,治愈','https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20665-TLgkL8T8IRFd.png','听不见自己琴声的少年遇到自由的小提琴手，灰色世界重新有了颜色。','A piano prodigy who cannot hear his playing meets a violinist who brings color back into his world.','音乐、爱与告别彼此缠绕，美丽得让人愿意重看。','Music, love and farewell intertwine in a beautiful story.'],
['水果篮子','Fruits Basket','フルーツバスケット','2019','治愈','Healing','奇幻,家庭,成长','https://www.manga-news.com/public/images/dvd/fruits-basket-anime-2019-s1-visual-2.jpg','本田透发现草摩家的生肖诅咒。魔法背后是一群渴望被爱的孤独灵魂。','Tohru discovers the Sohma family’s zodiac curse. Behind the magic are lonely people longing to be loved.','恋爱只是入口，它真正讲的是创伤、接纳与重新建立家。','Romance opens a deeper story about trauma, acceptance and family.'],
['指尖相触，恋恋不舍','A Sign of Affection','ゆびさきと恋々','2024','治愈','Healing','大学,手语,纯爱','https://animotaku.fr/wp-content/uploads/2023/07/anime-a-sign-of-affection-visuel-1.jpeg','听障大学生雪遇见热爱远方的逸臣，他们的距离在认真沟通中缩短。','Deaf student Yuki meets well-traveled Itsuomi. Patient communication draws their worlds together.','手语、眼神与触碰让理解成为爱情的核心。','Sign language, glances and touch make understanding the heart of this romance.']];

const $=x=>document.getElementById(x);function render(){const q=$('search').value.toLowerCase();const list=A.filter(a=>(mood==='全部'||a[4]===mood)&&(`${a[0]}${a[1]}${a[2]}${a[6]}`).toLowerCase().includes(q));$('grid').innerHTML=list.map((a,i)=>`<article class="card"><button class="cover" onclick="openAnime(${A.indexOf(a)})"><img src="${a[7]}" alt="${a[lang==='zh'?0:1]} poster"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="view">VIEW FILE ↗</span></button><div class="body"><div class="meta"><span>${a[3]} / ${lang==='zh'?a[4]:a[5]} / ★ 9.${i%4}</span></div><h3>${a[lang==='zh'?0:1]}</h3><p class="jp">${a[2]}</p><div class="tags">${a[6].split(',').map(t=>`<span>#${t}</span>`).join('')}</div><button class="heart ${favs.has(a[0])?'saved':''}" onclick="toggleFav('${a[0]}')">♥</button></div></article>`).join('');$('results').textContent=`SHOWING ${String(list.length).padStart(2,'0')} / ${String(A.length).padStart(2,'0')}`;$('empty').hidden=!!list.length;$('empty').textContent=lang==='zh'?'没有找到这份心动。换个关键词试试。':'No heartbeat found. Try another search.';$('favCount').textContent=favs.size}
function switchLang(){lang=lang==='zh'?'en':'zh';document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('lang').innerHTML=lang==='zh'?'<b>中</b><span>EN</span>':'<b>EN</b><span>中文</span>';$('heroTitle').innerHTML=lang==='zh'?'恋爱，不止<br><em>一种心跳。</em>':'Love has<br><em>many heartbeats.</em>';$('lead').textContent=lang==='zh'?'从青涩初恋到成人关系，从爆笑攻防到温柔告别。这里是一份随机策展、持续扩充的日本恋爱动漫图鉴。':'From first crushes to adult relationships, comic mind games to tender goodbyes—an evolving archive of Japanese romance anime.';$('featured').textContent=lang==='zh'?'本期封面':'FEATURED';$('featureName').textContent=A[1][lang==='zh'?0:1];$('archiveTitle').textContent=lang==='zh'?'心动档案':'Love Files';$('search').placeholder=lang==='zh'?'搜索作品、题材…':'Search titles or themes…';$('foot').textContent=lang==='zh'?'随机精选，不设排名。每一次心动都有自己的节奏。':'Randomly curated, never ranked. Every heartbeat has its own rhythm.';drawFilters();render();if(selected!==null)openAnime(selected)}
function drawFilters(){$('filters').innerHTML=moods.map(m=>`<button class="${mood===m[0]?'active':''}" onclick="mood='${m[0]}';drawFilters();render()">${m[lang==='zh'?0:1]}</button>`).join('')}function openAnime(i){selected=i;const a=A[i];$('modalImg').src=a[7];$('modalMeta').textContent='ROMANCE FILE · '+a[3];$('modalTitle').textContent=a[lang==='zh'?0:1];$('modalJp').textContent=a[2];$('stats').innerHTML=`<span>${a[3]}</span><span>${lang==='zh'?a[4]:a[5]}</span><span>★ 9.${i%4}</span>`;$('intro').textContent=a[lang==='zh'?8:9];$('whyTitle').textContent=lang==='zh'?'为什么值得看':'Why watch it';$('why').textContent=a[lang==='zh'?10:11];$('modalTags').innerHTML=a[6].split(',').map(t=>`<span>#${t}</span>`).join('');$('saveBtn').textContent=favs.has(a[0])?(lang==='zh'?'♥ 已加入心动收藏':'♥ Saved'):(lang==='zh'?'♡ 加入心动收藏':'♡ Save favorite');$('saveBtn').onclick=()=>{toggleFav(a[0]);openAnime(i)};$('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}function toggleFav(t){favs.has(t)?favs.delete(t):favs.add(t);render()}$('lang').onclick=switchLang;$('search').oninput=render;document.onkeydown=e=>{if(e.key==='Escape')closeModal()};drawFilters();render();
</script></body></html>
